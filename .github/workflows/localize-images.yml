name: 下載外部圖片到網站

on:
  push:
    branches: [main]
    paths: ['src/content/works/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localize-images
  cancel-in-progress: false

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock sharp
      - run: node scripts/localize-images.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/media src/content/works
          if git diff --cached --quiet; then echo "沒有需要下載的圖片"; exit 0; fi
          git commit -m "把外部圖片存到網站裡"
          git pull --rebase
          git push
